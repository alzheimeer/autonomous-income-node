services:
  # ── Autonomous Research & Intelligence Node ────────────────────────────────
  research:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: autonomous-research-node:latest
    container_name: ain-research-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - RESEARCH_DASHBOARD_PORT=3002
    ports:
      - "3002:3002"
    volumes:
      - ./data:/app/data
      - ./investigacion:/app/investigacion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: ["node", "dist/research/index.js"]
